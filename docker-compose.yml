services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-test-key-local-development-only
      - ALLOWED_HOSTS=*
      - AWS_STORAGE_BUCKET_NAME=django-users-roles-timdeluwine-storage
      - AWS_S3_REGION_NAME=us-east-1
      - STORAGE_BACKEND=local
      - USE_S3=False
    volumes:
      - sqlite_data:/home/appuser/app/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      JAVA_OPTS_APPEND: "-Xms64m -Xmx256m -XX:MetaspaceSize=96M -XX:MaxMetaspaceSize=128m"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro

volumes:
  sqlite_data:

