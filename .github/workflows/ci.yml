name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-backend:
    name: Code Quality & Pytest Coverage (>=80%)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Black Formatter Check
        run: black --check .

      - name: Run Pytest with Coverage Gate
        run: pytest

  e2e-playwright:
    name: Playwright E2E Tests (Chromium)
    runs-on: ubuntu-latest
    needs: lint-and-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install Node Dependencies
        working-directory: ./e2e
        run: npm ci

      - name: Install Playwright Chromium with system deps
        working-directory: ./e2e
        run: npx playwright install --with-deps chromium

      - name: Initialize Database & Create Superuser
        run: |
          python manage.py migrate
          python manage.py setup_roles
          python manage.py shell -c "from django.contrib.auth.models import User; u = User.objects.filter(username='admin').first() or User.objects.create_superuser('admin', 'admin@example.com', 'admin12345'); u.set_password('admin12345'); u.save()"

      - name: Start Django & Run E2E Tests
        run: |
          python manage.py runserver 127.0.0.1:8000 &
          # Ожидаем готовности сервера перед стартом тестов
          until curl -s http://127.0.0.1:8000/login/ > /dev/null; do sleep 1; done
          cd e2e
          npx playwright test

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7