<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Django Application{% endblock %}</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 40px; background-color: #f8f9fa;">
    <header style="border-bottom: 2px solid #ccc; padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
        <div>
            <a href="{% url 'home' %}" style="text-decoration: none; font-size: 20px; font-weight: bold; color: #333;" data-testid="nav-home">Главная</a>
            {% if user.is_authenticated %}
                <span style="margin: 0 10px;">|</span>
                <a href="{% url 'file_manager' %}" style="text-decoration: none; color: #0066cc;" data-testid="nav-files">Файлы</a>
                {% if is_admin_user %}
                    <span style="margin: 0 10px;">|</span>
                    <a href="{% url 'manage_users' %}" style="text-decoration: none; color: #0066cc;" data-testid="nav-manage">Панель управления (/manage/)</a>
                {% endif %}
            {% endif %}
        </div>
        <div>
            {% if user.is_authenticated %}
                <span>Вы вошли как: <strong>{{ user.username }}</strong></span>
                <form action="{% url 'logout' %}" method="post" style="display: inline; margin-left: 15px;">
                    {% csrf_token %}
                    <button type="submit" style="cursor: pointer;" data-testid="logout-btn">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" data-testid="login-link">Войти</a>
            {% endif %}
        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
