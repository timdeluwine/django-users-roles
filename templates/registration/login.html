{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<h2>Вход в систему</h2>
<form method="post">
    {% csrf_token %}
    <div>
        <label for="{{ form.username.id_for_label }}">Логин:</label>
        {{ form.username }}
    </div>
    <div>
        <label for="{{ form.password.id_for_label }}">Пароль:</label>
        {{ form.password }}
    </div>
    <br>
    <button type="submit" class="btn-primary">Войти</button>
</form>
{% endblock %}
